<header>
  <div class="brand" id="brandHome" title="กลับไปหน้าปก">
    <div class="logo">
      <img src="img/faculty-logo.png?v=4" alt="ตราคณะวิศวกรรมศาสตร์ มหาวิทยาลัยนเรศวร" class="logo-img" width="28" height="28" style="width:28px;height:28px;object-fit:contain;display:block">
    </div>
    <div>
      <b id="hdrFaculty">Faculty of Engineering</b>
      <span id="hdrSub">Research E-Book · Naresuan University</span>
    </div>
  </div>

  <nav>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="ค้นหาอาจารย์ / งานวิจัย..." autocomplete="off">
      <div id="searchResults" class="search-results"></div>
    </div>
    <select id="jump" aria-label="Jump to section"></select>
    <button id="prev" aria-label="Previous page" title="หน้าก่อนหน้า">&larr;</button>
    <form id="goto" class="goto" autocomplete="off" aria-label="Go to page">
      <input id="pageInput" type="text" inputmode="numeric" pattern="[0-9]*" value="1" aria-label="Page number (press Enter to go)" title="พิมพ์เลขหน้าแล้วกด Enter">
      <span class="of">/ <span id="total">12</span></span>
    </form>
    <button id="next" aria-label="Next page" title="หน้าถัดไป">&rarr;</button>
    <button id="btnTheme" title="สลับโทนพื้นหลัง Blueprint (สว่าง/มืด)">🌓</button>
  </nav>
</header>

<main>
  <div id="book">
    <!-- Pages are generated by js/main.js from js/data.js before initializing St.PageFlip -->
  </div>
  <p class="fallback" id="fb">ไม่สามารถโหลดไลบรารีพลิกหน้าหนังสือได้ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วรีโหลดหน้าเว็บอีกครั้ง</p>
</main>

<!-- Modal: ขยายดูรายละเอียดงานวิจัยฉบับเต็ม + QR Code -->
<div id="resDetailModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="resModalTitle">Featured Research Detail</h3>
      <button class="modal-close" id="closeResModal">&times; ปิด</button>
    </div>
    <div class="modal-body" id="resModalBody"></div>
  </div>
</div>
